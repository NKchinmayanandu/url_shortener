version: '3.8'

services:
  app-1:
    image: your-app-image:latest
    container_name: my_app_1
    networks:
      - app-network
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-0:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis-0:6379
    depends_on:
      - postgres-0
      - redis-0

  app-2:
    image: your-app-image:latest
    container_name: my_app_2
    networks:
      - app-network
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-0:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis-0:6379
    depends_on:
      - postgres-0
      - redis-0

  app-3:
    image: your-app-image:latest
    container_name: my_app_3
    networks:
      - app-network
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-0:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis-0:6379
    depends_on:
      - postgres-0
      - redis-0
  
  postgres-0:
    image: postgres:18 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - app-network

  postgres-1:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    networks:
      - app-network

  postgres-2:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    networks:
      - app-network

  redis-0:
    image: redis:8
    ports:
      - "6379:6379"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: my_nginx_container
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - app-1
      - app-2
      - app-3

networks:
  app-network:
    driver: bridge