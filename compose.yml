services:

  app-1:
    build: .
    image: url-shortener:local
    container_name: my_app_1
    networks:
      - app-network
    volumes:
      - .:/app
    environment:
      - INSTANCE_ID=app-1
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-0:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis-0:6379
    depends_on:
      - postgres-0
      - redis-0

  app-2:
    image: url-shortener:local
    container_name: my_app_2
    networks:
      - app-network
    volumes:
      - .:/app
    environment:
      - INSTANCE_ID=app-2
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-0:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis-0:6379
    depends_on:
      - postgres-0
      - redis-0

  app-3:
    image: url-shortener:local
    container_name: my_app_3
    networks:
      - app-network
    volumes:
      - .:/app
    environment:
      - INSTANCE_ID=app-3
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-0:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis-0:6379
    depends_on:
      - postgres-0
      - redis-0

  postgres-0:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_0_data:/var/lib/postgresql/data
    networks:
      - app-network

  postgres-1:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_1_data:/var/lib/postgresql/data
    networks:
      - app-network

  postgres-2:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_2_data:/var/lib/postgresql/data
    networks:
      - app-network
  redis-0:
    image: redis:8
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: my_nginx_container
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - app-1
      - app-2
      - app-3

volumes:
  postgres_0_data:
  postgres_1_data:
  postgres_2_data:

networks:
  app-network:
    driver: bridge